name: Build T-Embed CC1101 Plus Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python & PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U platformio esptool

      - name: Apply Hardware, 120s Dimmer, LED Timeout & FastLED Fixes
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. Sub-GHz Antenna Switch Guard Fix (preserve newline!)
          rf = "src/modules/rf/rf_utils.cpp"
          if os.path.exists(rf):
              s = open(rf, encoding="utf-8").read()
              s = re.sub(
                  r'(#if\s+defined\(T_EMBED\))(?![ \t]*\|\|[ \t]*defined\(T_EMBED_1101\))',
                  r'\1 || defined(T_EMBED_1101)',
                  s
              )
              open(rf, "w", encoding="utf-8").write(s)
              print("[+] Patched Sub-GHz antenna switch in", rf)

          # 2. Speaker I2S Pins Verification
          pins = "boards/lilygo-t-embed-cc1101/pins_arduino.h"
          if os.path.exists(pins):
              s = open(pins, encoding="utf-8").read()
              s = re.sub(r'(#define\s+BCLK_PIN\s+)\d+', r'\g<1>7', s)
              s = re.sub(r'(#define\s+WCLK_PIN\s+)\d+', r'\g<1>5', s)
              s = re.sub(r'(#define\s+DOUT_PIN\s+)\d+', r'\g<1>6', s)
              open(pins, "w", encoding="utf-8").write(s)
              print("[+] Verified Speaker I2S pins in", pins)

          # 3. BLE Scan Response Fix
          for r, _, files in os.walk("src"):
              for fn in files:
                  if fn.endswith((".cpp", ".h")):
                      p = os.path.join(r, fn)
                      c = open(p, encoding="utf-8", errors="ignore").read()
                      if "enableScanResponse(false)" in c:
                          open(p, "w", encoding="utf-8").write(c.replace("enableScanResponse(false)", "enableScanResponse(true)"))
                          print("[+] Enabled BLE scan response in", p)

          # 4. Add 120s Dim Timeout to Config Validator & Settings Menu
          cfg_cpp = "src/core/config.cpp"
          if os.path.exists(cfg_cpp):
              c = open(cfg_cpp, encoding="utf-8").read()
              c = re.sub(r'if\s*\(\s*dimmerSet\s*>\s*60\s*\)', 'if (dimmerSet > 120)', c)
              open(cfg_cpp, "w", encoding="utf-8").write(c)
              print("[+] Extended dimmerSet max validation to 120s in", cfg_cpp)

          for r, _, files in os.walk("src/core"):
              for fn in files:
                  if fn.endswith((".cpp", ".h")):
                      p = os.path.join(r, fn)
                      c = open(p, encoding="utf-8", errors="ignore").read()
                      orig = c
                      c = re.sub(
                          r'(\{\s*"60s"\s*,\s*\[=\]\(\)\s*\{\s*(?:bruceConfig\.)?setDimmer\(60\);\s*\}\s*\}\s*,?)',
                          r'\1\n        {"120s", [=]() { bruceConfig.setDimmer(120); }},',
                          c
                      )
                      if '"120s"' not in c and '"60s"' in c and 'setDimmer' in c:
                          c = re.sub(
                              r'(\{\s*"60s"\s*,([^\}]+60[^\}]*)\}\s*,?)',
                              lambda m: m.group(0) + '\n        {"120s",' + m.group(2).replace('60', '120') + '},',
                              c
                          )
                      if c != orig:
                          open(p, "w", encoding="utf-8").write(c)
                          print("[+] Added 120s Dim Time option in", p)

          # 5. Sync LED Timeout with LCD Dimmer Intervals & Add LED Timeout Menu Option
          ps_cpp = "src/core/powerSave.cpp"
          if os.path.exists(ps_cpp):
              c = open(ps_cpp, encoding="utf-8").read()
              if "FastLED" not in c and "core/led_control.h" in c:
                  c = c.replace(
                      'setBrightness(0, false);',
                      'setBrightness(0, false);\n#ifdef HAS_RGB_LED\n        setLedBrightness(0);\n#endif'
                  )
              open(ps_cpp, "w", encoding="utf-8").write(c)

          for target in ["src/core/menu_items/ConfigMenu.cpp", "src/core/settings.cpp"]:
              if os.path.exists(target):
                  c = open(target, encoding="utf-8").read()
                  if '"LED Timeout"' not in c and '"Dim Time"' in c:
                      c = c.replace(
                          '{"Dim Time", setDimmerTimeMenu},',
                          '{"Dim Time", setDimmerTimeMenu},\n        {"LED Timeout", setDimmerTimeMenu},'
                      )
                      open(target, "w", encoding="utf-8").write(c)
                      print("[+] Added LED Timeout interval menu in", target)

          # 6. Register PlatformIO pre-build hook to sanitize FastLED 'FP' macro collision inside pio run
          hook_code = '''Import("env")
          import os, re

          def sanitize_fastled():
              libdeps_dir = env.subst("$PROJECT_LIBDEPS_DIR/$PIOENV")
              if os.path.exists(libdeps_dir):
                  count = 0
                  for root, _, files in os.walk(libdeps_dir):
                      if "FastLED" in root:
                          for fn in files:
                              if fn.endswith((".h", ".hpp", ".cpp", ".cc", ".c")):
                                  p = os.path.join(root, fn)
                                  try:
                                      with open(p, "r", encoding="utf-8", errors="ignore") as f:
                                          c = f.read()
                                      new_c = re.sub(r'\\bFP\\b', 'FASTLED_FP', c)
                                      if new_c != c:
                                          with open(p, "w", encoding="utf-8") as f:
                                              f.write(new_c)
                                          count += 1
                                  except Exception:
                                      pass
                  print(f"[PRE-BUILD HOOK] Sanitized {count} FastLED files in {libdeps_dir}")

          sanitize_fastled()
          '''
          with open("fix_fastled_fp.py", "w", encoding="utf-8") as f:
              f.write("\n".join(line[10:] if line.startswith("          ") else line for line in hook_code.splitlines()) + "\n")

          with open("platformio.ini", "r", encoding="utf-8") as f:
              pio_ini = f.read()
          if "pre:fix_fastled_fp.py" not in pio_ini:
              if "[env:lilygo-t-embed-cc1101]" in pio_ini:
                  pio_ini = pio_ini.replace(
                      "[env:lilygo-t-embed-cc1101]",
                      "[env:lilygo-t-embed-cc1101]\nextra_scripts = \n\t${env.extra_scripts}\n\tpre:fix_fastled_fp.py"
                  )
              else:
                  pio_ini += "\n[env:lilygo-t-embed-cc1101]\nextra_scripts = pre:fix_fastled_fp.py\n"
              with open("platformio.ini", "w", encoding="utf-8") as f:
                  f.write(pio_ini)
              print("[+] Registered pre:fix_fastled_fp.py in platformio.ini")
          EOF

      - name: Install Dependencies with Retry & Compile
        run: |
          for i in {1..3}; do
            pio pkg install -e lilygo-t-embed-cc1101 && break || sleep 5
          done
          pio run -e lilygo-t-embed-cc1101

      - name: Merge Binary, Package JS Interpreter & Generate Features .txt Guides
        run: |
          mkdir -p release_bundle/SD_Card_Root/interpreter
          mkdir -p release_bundle/SD_Card_Root/scripts
          mkdir -p release_bundle/SD_Card_Root/features

          python3 -m esptool --chip esp32s3 merge_bin \
            -o release_bundle/bruce-t-embed-cc1101-plus-FIXED.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 .pio/build/lilygo-t-embed-cc1101/bootloader.bin \
            0x8000 .pio/build/lilygo-t-embed-cc1101/partitions.bin \
            0x10000 .pio/build/lilygo-t-embed-cc1101/firmware.bin

          if [ -d "sd_files/interpreter" ]; then
            cp -r sd_files/interpreter/* release_bundle/SD_Card_Root/interpreter/ || true
            cp -r sd_files/interpreter/* release_bundle/SD_Card_Root/scripts/ || true
          fi
          if [ -d "sd_files" ]; then
            cp -rn sd_files/* release_bundle/SD_Card_Root/ || true
          fi

          python3 - << 'EOF'
          import os

          out_dir = "release_bundle/SD_Card_Root/features"
          os.makedirs(out_dir, exist_ok=True)

          guides = {
              "00_OVERVIEW_AND_PINS.txt": """========================================
          BRUCE FIRMWARE - T-EMBED CC1101 PLUS
          QUICK HARDWARE & PIN REFERENCE
          ========================================
          Target Board: LILYGO T-Embed CC1101 Plus
          MCU: ESP32-S3 (16MB Flash, 8MB PSRAM)

          BUILT-IN HARDWARE MODULES:
          1. Sub-GHz Radio: TI CC1101 (300-928 MHz)
             - Uses internal SPI + Antenna Switch (SW0=48, SW1=47)
             - Patched in this build for full External Antenna RX/TX!
          2. 2.4GHz Radio: nRF24L01 (Plus Model)
             - Shares CE=GPIO 43 & CS=GPIO 44 with UART Grove port.
             - Leave GPS disabled when using nRF24 tools.
          3. NFC / RFID: PN532 (13.56 MHz)
          4. Infrared (IR): Built-in IR TX LED & IR RX Receiver
          5. Audio: I2S Speaker (BCLK=7, WCLK=5, DOUT=6) & PDM Mic
          6. Display & Input: ST7789 LCD + Rotary Encoder + APA102 LEDs
          """,

              "01_WIFI_TOOLS.txt": """========================================
          WIFI MODULE - TOOLS & DESCRIPTIONS
          ========================================
          - Connect WiFi: Join a 2.4GHz network to enable web tools, NTP time sync, or Evil Portal.
          - WiFi AP: Starts Bruce's own Access Point so you can connect from your phone/PC and use the WebUI (http://bruce.local or 192.168.4.1).
          - Evil Portal: Creates a rogue captive portal WiFi network with customizable login HTML pages (stored on SD card) to test credential capture.
          - Beacon Spam: Broadcasts dozens of fake WiFi SSIDs (custom list, random, or Rickroll names) to nearby devices.
          - Deauth Attack: Sends 802.11 deauthentication frames to disconnect clients from a selected 2.4GHz target AP.
          - Sniffer / Raw PCAP: Passively captures 802.11 management/data frames and EAPOL handshakes directly to .pcap files on your SD card.
          - Scan / Wardriving: Scans nearby WiFi networks, signal strengths, channels, and MAC addresses (logs to Wigle CSV when GPS is active).
          - Telnet / SSH / TCP-UDP Client: Built-in network terminal utilities for interacting with remote hosts.
          - WireGuard: Connects your device to a WireGuard VPN tunnel.
          """,

              "02_BLE_BLUETOOTH_TOOLS.txt": """========================================
          BLE (BLUETOOTH LOW ENERGY) TOOLS
          ========================================
          * Note: This build includes the BLE Scan Response fix so device names are never truncated!

          - BLE Scan: Scans nearby Bluetooth Low Energy devices, showing full device names, MAC addresses, RSSI, and advertisement payloads.
          - BLE Media Control: Pairs as a Bluetooth HID remote to play/pause, skip tracks, or adjust volume on your phone/PC.
          - BadBLE (BLE Keyboard): Emulates a Bluetooth keyboard to execute DuckyScript payloads wirelessly on a paired phone, tablet, or computer.
          - Apple / iOS Spam (SourApple): Broadcasts spoofed Continuity/AirPods/AppleTV pairing popups to nearby iPhones and iPads.
          - Windows SwiftPair Spam: Broadcasts spoofed Bluetooth peripheral pairing notifications to Windows PCs.
          - Android FastPair / Samsung Spam: Broadcasts spoofed FastPair accessory popups to Android devices.
          - Spam All: Cycles through iOS, Windows, Android, and Samsung BLE advertisement payloads simultaneously.
          """,

              "03_SUBGHZ_RF_CC1101_TOOLS.txt": """========================================
          RF (SUB-GHZ CC1101) TOOLS
          ========================================
          * Note: This build includes the T-Embed CC1101 Plus Antenna Switch patch so GPIO 47/48 properly route your external/internal antenna across all frequency bands (300-348, 387-464, 779-928 MHz).

          - Scan / Frequency Analyzer: Sweeps Sub-GHz frequencies to detect the exact frequency (e.g., 315.00, 433.92, 868.35, 915.00 MHz) of a transmitting remote.
          - Copy / Raw Read: Records raw Sub-GHz signals or decodes known fixed-code protocols (Princeton, Came, Nice, Linear, etc.) and saves them as Flipper-compatible .sub files on the SD card.
          - Replay / Saved Signals: Transmits saved .sub files from your SD card.
          - Spectrum Analyzer: Real-time visual waterfall/bar graph of Sub-GHz RF activity across a chosen frequency band.
          - Jammer (Noise): Transmits continuous carrier noise on a selected frequency for RF interference testing.
          - Brute Force: Iterates through common 8-bit to 12-bit fixed-code gate/garage key spaces.
          - Custom SubGHz: Manually transmit specific hex codes, bit lengths, and pulse durations.
          - Config -> RF Module: Keep set to 'CC1101' to use the built-in radio. (The 'RF TX=43 / RX=44' pins are ignored when CC1101 is selected).
          """,

              "04_RFID_NFC_PN532_TOOLS.txt": """========================================
          RFID / NFC (13.56 MHz PN532) TOOLS
          ========================================
          - Read Tag: Reads UID, SAK, ATQA, and data blocks from 13.56MHz ISO14443A cards/fobs (Mifare Classic 1K/4K, Ultralight, NTAG).
          - Clone / Write UID: Writes a captured UID onto a magic/writable Gen1a or Gen2 (CUID) Mifare card.
          - Read/Write Mifare Blocks: Uses default key dictionaries to dump sectors from Mifare Classic tags and write them to blank tags.
          - Erase Tag: Formats NDEF/Mifare blocks back to factory blank values.
          - Save / Load File: Saves dumped tags to Flipper-compatible .nfc files on your SD card.
          - Amiibo / NTAG Emulation: Emulates supported NTAG215 / UID profiles directly from the PN532 hardware.
          """,

              "05_INFRARED_IR_TOOLS.txt": """========================================
          INFRARED (IR) TOOLS
          ========================================
          - TV-B-Gone: Cycles through universal power-off IR codes to turn off almost any TV, projector, or monitor in range.
          - IR Read (Learn Remote): Captures IR signals from any household remote (NEC, Sony, RC5, RC6, Samsung, or Raw timings) using the built-in IR receiver and saves them as .ir files.
          - IR Replay / Custom Remotes: Transmits saved .ir files from your SD card (compatible with Flipper Zero IRDB .ir libraries!).
          - IR Jammer: Pulses high-frequency IR light to block standard infrared remotes from communicating with receivers.
          """,

              "06_NRF24_24GHZ_TOOLS.txt": """========================================
          NRF24 (2.4 GHz TRANSCEIVER) TOOLS
          ========================================
          * Hardware Note (Plus Model): The internal nRF24 uses GPIO 43 (CE) and GPIO 44 (CS). Make sure GPS is turned OFF when using nRF24 tools!

          - 2.4GHz Spectrum Analyzer: Visualizes real-time 2.4GHz RF traffic across all 125 nRF24 channels (WiFi, Bluetooth, Zigbee, wireless mice).
          - MouseJack Scan & Attack: Scans for vulnerable non-Bluetooth 2.4GHz wireless mice/keyboard dongles (Logitech Unifying, Microsoft, Dell) and injects keystrokes wirelessly.
          - 2.4GHz Jammer /Hopper: Sweeps noise across 2.4GHz channels (BLE advertising channels, WiFi channels, or full band).
          """,

              "07_BADUSB_HID_TOOLS.txt": """========================================
          BADUSB (USB HID KEYBOARD/MOUSE) TOOLS
          ========================================
          - Run DuckyScript: Plugs into any PC/Mac/Phone via USB-C and emulates a trusted USB keyboard/mouse to run automated keystroke scripts (.txt DuckyScript files from your SD card).
          - USB Mass Storage / SD Mount: Exposes your MicroSD card over USB so you can drag-and-drop files without removing the card.
          - Keyboard Layout: Select US, UK, DE, FR, ES, PT-BR, and other keyboard layouts so symbols type accurately.
          """,

              "08_JS_INTERPRETER_SCRIPTS.txt": """========================================
          JS INTERPRETER (DUKTAPE JAVASCRIPT)
          ========================================
          Allows you to run custom apps, games, and hardware automation scripts written in JavaScript (.js) directly from the '/interpreter' or '/scripts' folder on your SD card!

          INCLUDED SCRIPTS IN THIS BUNDLE:
          - audio.js: Plays tones and tests the I2S speaker.
          - badusb_key_test.js: Tests USB HID keystroke injection.
          - browser_bruce.js: Simple HTTP request/web fetcher on screen.
          - calculator.js: On-screen rotary encoder calculator.
          - dino_game.js: Playable Chrome Dino runner game!
          - draw.js: Etch-a-sketch drawing pad using the encoder.
          - files.js: Example script for reading/writing SD card files.
          - gifs.js: Plays animated GIFs on the display.
          - gpio.js: Toggle and read expansion GPIO pins directly.
          - ir2keys.js: Maps any TV remote's IR buttons into wireless USB/BLE keyboard shortcuts for your PC!
          - notification.js: Triggers custom screen/audio notifications.
          - rf_brute.js: Custom programmable Sub-GHz brute-forcer.
          - storage_read.js: Inspects LittleFS / SD storage usage.
          - wifi_connect.js / wifi_scan.js: Scripted WiFi automation.
          """,

              "09_OTHER_FM_MIC_GPS_FILES_CONFIG.txt": """========================================
          FM, MIC, GPS, FILES & CONFIG TOOLS
          ========================================
          - Files (File Manager): Browse your MicroSD card and internal LittleFS flash. Open and read .txt files (including these guides!), view images/GIFs, play .wav/.mp3 audio, or launch .sub/.ir/.nfc/.js files directly.
          - Mic / Audio Spectrum: Uses the built-in digital microphone to display a real-time audio FFT spectrum analyzer or record audio to SD.
          - WebUI: Manage files, upload scripts, and trigger payloads from any web browser over WiFi.
          - GPS (External Grove UART): Reads NMEA coordinates, speed, altitude, and satellites for Wardriving when a UART GPS module is connected.
          - Config (Settings):
            * Brightness: Adjusts LCD backlight level.
            * Dim Time: Now includes 10s, 15s, 30s, 60s, and 120s!
            * LED Timeout: Syncs APA102 RGB LED timeout intervals with the LCD dimmer.
            * UI Color / Theme: Customize Bruce's interface colors, sound effects, startup image, and clock.
          """
          }

          for filename, text in guides.items():
              clean_text = "\n".join(line[10:] if line.startswith("          ") else line for line in text.strip().splitlines()) + "\n"
              with open(os.path.join(out_dir, filename), "w", encoding="utf-8") as f:
                  f.write(clean_text)
          print(f"[+] Generated {len(guides)} readable .txt guides in {out_dir}")
          EOF

      - name: Upload Firmware + SD Card JS & Features Bundle
        uses: actions/upload-artifact@v4
        with:
          name: bruce-t-embed-cc1101-plus-FIXED-and-SD-pack
          path: release_bundle/
